{% if not is_htmx %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sebastian{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% block extra_css %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/gui/">{% block brand %}Sebastian{% endblock %}</a>
    <div class="collapse navbar-collapse" id="nav-menu">
      {% block nav_items %}{% endblock %}
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">
  <div class="row">
    <main class="col" id="sebastian-content">
    <div id="sebastian-messages" class="mb-2"></div>
{% endif %}

{% block content %}{% endblock %}

{% if not is_htmx %}
    </main>
  </div>
</div>

<div id="sebastian-modal"></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="sebastian-toasts"></div>

<script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
{% block extra_js %}{% endblock %}
<script>
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    if (evt.detail.xhr.status >= 400) {
      evt.detail.shouldSwap = true;
      var msg = document.getElementById('sebastian-messages');
      if (msg) { evt.detail.target = msg; }
    }
  });

  /* File-field helpers -------------------------------------------------- */

  function sbFileClear(fieldName) {
    var badge = document.getElementById('sb-file-badge-' + fieldName);
    var fileInp = document.getElementById('id_' + fieldName);
    if (fileInp) {
      fileInp.disabled = true;
      fileInp.setAttribute('data-sb-pending', '1');
    }
    if (badge) {
      badge.innerHTML =
        '<span class="badge bg-warning text-dark fw-normal">' +
        '<i class="bi bi-x-circle me-1"></i>File verrà rimosso</span>';
    }
  }

  /* htmx:configRequest fires after HTMX has collected form parameters but
     before the XHR is sent — the only reliable place to add/remove entries.

     1. Drop enabled file inputs with no file selected so partial-PATCH
        leaves the existing server-side file untouched.
     2. Inject '' for file fields the user explicitly cleared via sbFileClear
        (their hidden clear input is tagged with data-sb-pending).           */
  document.body.addEventListener('htmx:configRequest', function (evt) {
    var elt = evt.detail.elt;
    var form = elt.tagName === 'FORM' ? elt : (elt.closest && elt.closest('form'));
    if (!form) { return; }
    var params = evt.detail.parameters;

    form.querySelectorAll('input[type=file].sb-file-input:not([disabled])').forEach(function (inp) {
      if (!inp.files || !inp.files.length) { delete params[inp.name]; }
    });

    form.querySelectorAll('[data-sb-pending]').forEach(function (inp) {
      if (inp.name) { params[inp.name] = ''; }
    });
  });

  document.body.addEventListener('htmx:afterRequest', function (evt) {
    document.querySelectorAll('[data-sb-pending]').forEach(function (inp) {
      inp.removeAttribute('data-sb-pending');
    });
  });
</script>
</body>
</html>{% endif %}
