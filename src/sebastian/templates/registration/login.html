{% load i18n sebastian_tags static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% strans "Sign in" %} — Sebastian</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container" style="max-width: 24rem; margin-top: 8rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title mb-3 text-center">Sebastian</h4>

      {% if form.errors %}
      <div class="alert alert-danger py-2">{% strans "Invalid username or password." %}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">{% strans "Username" %}</label>
          <input type="text" class="form-control" id="id_username" name="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">{% strans "Password" %}</label>
          <input type="password" class="form-control" id="id_password" name="password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">{% strans "Sign in" %}</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
